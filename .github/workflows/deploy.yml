name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # 测试只覆盖纯函数（cron 管理、跨仓库契约），不依赖数据库与网络，
      # 所以放在构建之前 —— 失败就尽早退出，不浪费 vite 构建时间。
      - name: Test
        run: npm test

      - name: Build topology editor
        run: npm run build

      - name: Get version
        id: ver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          mkdir -p pkg
          cp server.js package.json package-lock.json config.js pkg/
          cp -r lib/ routes/ views/ public/ pkg/
          cp scripts/restart-n150.sh pkg/restart.sh
          cp scripts/backup-r2.sh pkg/backup-r2.sh
          cp scripts/backup-r2-controller.sh pkg/backup-r2-controller.sh
          # lib/cron.js 生成的 crontab 条目会调用 <deploy>/scripts/cron-runner.js。
          # 该文件必须随包分发，否则所有被托管的任务都会 MODULE_NOT_FOUND 静默失败
          # （错误被条目里的 >/dev/null 2>&1 吞掉，界面上完全看不出来）。
          mkdir -p pkg/scripts
          cp scripts/cron-runner.js pkg/scripts/
          cd pkg && npm ci --omit=dev && cd ..
          # better-sqlite3 的 deps/ 是「编译期」用的 SQLite 源码（约 9MB），
          # 运行时只需要 build/Release/*.node。实测删除后加载与读写均正常
          # （2026-10-14 验证）。包每小 1MB，N150 从镜像下载就少一分超时风险
          # —— 部署链路的下载超时是 90 秒，而镜像实测只有几十 KB/s。
          rm -rf pkg/node_modules/better-sqlite3/deps
          echo "${{ steps.ver.outputs.sha }}" > pkg/.version
          tar -czf wemonitor.tar.gz -C pkg .
          ls -lh wemonitor.tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          # 每个构建用唯一 tag（commit sha）发布，避免 latest tag 的下载资源
          # 被 CDN 缓存滞后一版，导致自动更新始终拿到旧包、版本校验失败。
          tag_name: ${{ steps.ver.outputs.sha }}
          name: ${{ steps.ver.outputs.sha }}
          body: "Auto build ${{ steps.ver.outputs.sha }}"
          files: wemonitor.tar.gz
          prerelease: true

      # 同步上传到 Cloudflare R2（2026-10-15）：N150 在大陆，出境到 GitHub 只剩约
      # 3.5KB/s（ghproxy 镜像已废、直连不通），本包 17.5MB 在下载预算里根本下不完，
      # 会长时间占住 deploy-agent 的单 worker，阻塞所有项目的部署。
      # R2 走 Cloudflare 通道实测约 698KB/s（17.5MB 约 25 秒）。
      # continue-on-error：R2 没配凭据时只是跳过上传，发布与部署照旧（自动回退）。
      - name: Upload to R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # 自定义 endpoint 必须显式给 region，aws cli 否则会报 "You must specify a region"
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 未配置（缺 R2_BUCKET / R2_ACCOUNT_ID），跳过上传"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          aws s3 cp wemonitor.tar.gz \
            "s3://${R2_BUCKET}/wemonitor/${{ steps.ver.outputs.sha }}/wemonitor.tar.gz" \
            --endpoint-url "$ENDPOINT"
          echo "✓ 已上传到 R2"

      - name: Notify N150
        continue-on-error: true
        run: |
          curl -sS -X POST https://wemusic.sherlockguo.com/deploy \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"wemonitor\",\"version\":\"${{ steps.ver.outputs.sha }}\"}" \
            --max-time 10 --connect-timeout 5 || true
